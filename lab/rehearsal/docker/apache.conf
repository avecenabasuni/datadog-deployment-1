<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    ProxyRequests Off
    ProxyPass /api/ http://api/ connectiontimeout=5 timeout=10
    ProxyPassReverse /api/ http://api/
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
